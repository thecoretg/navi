<!doctype html>
<html lang="en" data-theme="light" data-palette="harbor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview · navi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../skills/navi-ui/assets/navi.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2317160F'/><text x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23F6F4EF' text-anchor='middle'>n</text></svg>">
</head>
<body>

<div class="app" id="app">

  <!-- ░░ SIDEBAR ░░ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">n</div>
      <div class="brand-name">navi</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="user-chip" data-action="notifications">
        <span class="avatar sm">DR</span>
        <span class="user-meta"><b>Danny Reyes</b><span>danny@navi.app</span></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             style="width:14px;height:14px;margin-left:auto;color:var(--faint)"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  </aside>

  <!-- ░░ MAIN ░░ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" data-action="mobile-nav" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="icon-btn desktop-only" data-action="collapse" data-tip="Toggle sidebar" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>

      <nav class="crumbs desktop-only">
        <span class="muted">navi</span>
        <span class="sep">/</span>
        <span class="muted" id="crumb-parent"></span>
        <span class="here" id="crumb-here">Overview</span>
      </nav>

      <div class="grow"></div>

      <button class="searchbtn" data-action="cmdk" id="search-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search or jump to…</span>
        <span class="keys" id="search-keys" aria-hidden="true"></span>
      </button>

      <button class="icon-btn swatch-btn" id="palette-btn" data-action="palette" data-tip="Colour palette" aria-label="Colour palette">
        <span class="swatch"></span>
      </button>

      <button class="icon-btn has-dot" data-action="notifications" data-tip="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>

      <button class="icon-btn" id="theme-btn" data-action="theme" data-tip="Theme" aria-label="Toggle theme"></button>

      <span class="avatar sm" style="margin-left:4px">DR</span>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<!-- ░░ OVERLAYS ░░ -->
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>

<div class="cmdk" id="cmdk" role="dialog" aria-modal="true">
  <div class="cmdk-input">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="cmdk-input" placeholder="Type a command or search…" autocomplete="off" spellcheck="false" aria-label="Search commands">
    <span class="keys"><span class="kbd">Esc</span></span>
  </div>
  <div class="cmdk-list" id="cmdk-list"></div>
</div>

<div class="toasts" id="toasts"></div>
<div class="chart-tip" id="chart-tip"></div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
